name: Secret Scan

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # 04:00 UTC = 06:00 CAT daily.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the scan covers commits, not just the working tree.
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          # Official OSS container, same image and flags as lira-backend. The gitleaks-action
          # needs a license for org-owned repos.
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source . --config .gitleaks.toml --ignore-gitleaks-allow --redact --verbose
